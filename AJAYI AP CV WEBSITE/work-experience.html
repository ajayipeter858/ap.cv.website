<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work Experiences</title>
    <script src="script.js"></script>
    <style>
        /* General styles */
        body {
            font-family: Arial, sans-serif;
            background-color: peachpuff;
            margin: 0;
            padding: 0;
        }

        /* Navigation bar */
        nav {
            background-color: #333;
            padding: 10px 0;
            text-align: center;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #f9d19d; /* Lighter peach color on hover */
        }

        /* Container layout */
        .container {
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 20px;
            gap: 40px;
        }

        /* Form container */
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            flex-shrink: 0;
        }

        /* Experience List styling */
        .experience-list {
            flex: 2;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
        }

        .experience-box {
            background-color: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 250px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .experience-box img {
            width: 100%;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .experience-box h4 {
            margin: 5px 0;
            font-size: 16px;
            font-weight: bold;
        }

        .experience-box p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }

        .experience-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .experience-actions button {
            border: none;
            background-color: transparent;
            cursor: pointer;
            color: red;
            padding: 5px;
            font-size: 14px;
        }

        .experience-actions button.edit {
            color: blue;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .form-container {
                width: 95%;
                max-width: 400px;
            }

            .experience-list {
                justify-content: center;
            }

            nav ul {
                flex-wrap: wrap;
                gap: 10px;
                padding: 0 10px;
            }
            
            nav ul li a {
                font-size: 14px;
                padding: 5px 8px;
            }
        }

        @media (max-width: 480px) {
            nav ul {
                flex-direction: column;
                gap: 5px;
            }
            
            nav ul li a {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="personal-info.html">Personal Info</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="work-experience.html">Work Experience</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <div class="form-container">
        <h2>Add New Work Experience</h2>
        <form id="experienceForm">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="description">Description:</label><br>
            <textarea id="description" name="description" required></textarea><br><br>
            <label for="logoUrl"> Company Logo URL:</label><br>
            <input type="url" id="logoUrl" name="logoUrl" placeholder="Enter logo URL"><br><br>
            <button type="submit">Add Work Experience</button>
        </form>
    </div>

    <div class="experience-list" id="experienceList">
        <!-- Entries will be added here -->
    </div>
</div>

<script>
    const pageKey = 'workExperience';

    // Initialize responsive design and load entries
    document.addEventListener('DOMContentLoaded', function() {
        CVResponsiveHelper.makeFormResponsive();
        loadEntries();
    });

    // Add new experience event
    document.getElementById('experienceForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        
        // Always check authentication before adding
        const authenticated = await CVAuthManager.authenticate();
        if (!authenticated) {
            return;
        }

        let name = document.getElementById('name').value;
        let description = document.getElementById('description').value;
        let logoUrl = document.getElementById('logoUrl').value;

        // Get entries from centralized storage
        let entries = CVDataManager.loadData(pageKey) || [];

        // Create a new experience object
        let newExperience = {
            id: Date.now(), // unique ID based on timestamp
            name: name,
            description: description,
            logoUrl: logoUrl
        };

        // Add the new experience to the array
        entries.push(newExperience);

        // Save to centralized storage
        if (CVDataManager.saveData(pageKey, entries)) {
            // Refresh the displayed entries
            loadEntries();
            // Clear the form
            document.getElementById('experienceForm').reset();
        } else {
            alert('Error saving work experience. Please try again.');
        }
    });

    // Load and display entries from centralized storage
    function loadEntries() {
        // Get entries from centralized storage
        let entries = CVDataManager.loadData(pageKey) || [];

        let experienceList = document.getElementById('experienceList');
        experienceList.innerHTML = ''; // Clear the current list

        // Add each experience as a box on the right
        entries.forEach(experience => {
            let experienceBox = document.createElement('div');
            experienceBox.classList.add('experience-box');

            // Check if a logo URL exists and display the image
            let logoHtml = experience.logoUrl ? `<img src="${experience.logoUrl}" alt="Logo">` : '';

            const isAuthenticated = CVAuthManager.isAuthenticated();
            const actionButtons = isAuthenticated ? `
                <div class="experience-actions">
                    <button class="delete" onclick="deleteExperience(${experience.id})">Delete</button>
                    <button class="edit" onclick="editExperience(${experience.id})">Edit</button>
                </div>
            ` : '';

            experienceBox.innerHTML = `
                ${logoHtml}
                <h4>${experience.name}</h4>
                <p>${experience.description}</p>
                ${actionButtons}
            `;

            experienceList.appendChild(experienceBox);
        });
    }

    // Delete an experience
    async function deleteExperience(id) {
        // Always check authentication before deleting
        const authenticated = await CVAuthManager.authenticate();
        if (!authenticated) {
            return;
        }

        if (confirm('Are you sure you want to delete this work experience?')) {
            if (CVDataManager.deleteData(pageKey, id)) {
                loadEntries();
            } else {
                alert('Error deleting work experience. Please try again.');
            }
        }
    }

    // Edit an experience
    async function editExperience(id) {
        // Always check authentication before editing
        const authenticated = await CVAuthManager.authenticate();
        if (!authenticated) {
            return;
        }

        // Get entries from centralized storage
        let entries = CVDataManager.loadData(pageKey) || [];
        let experienceToEdit = entries.find(experience => experience.id === id);

        if (experienceToEdit) {
            document.getElementById('name').value = experienceToEdit.name;
            document.getElementById('description').value = experienceToEdit.description;
            document.getElementById('logoUrl').value = experienceToEdit.logoUrl;

            // Remove the old experience so the updated one can be saved
            deleteExperience(id);
        }
    }
</script>

</body>
</html>
