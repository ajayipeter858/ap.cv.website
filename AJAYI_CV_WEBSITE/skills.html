<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills — Ajayi AP</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="script.js" defer></script>
    <style>
        .skill-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: border-color var(--transition), transform var(--transition);
        }

        .skill-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        .skill-category {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .stag {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 5px;
            padding: 0.25rem 0.65rem;
            font-size: 0.8rem;
            font-weight: 500;
            transition: border-color var(--transition), color var(--transition);
        }

        .stag:hover { border-color: var(--accent2); color: var(--accent2); }

        /* Icons for each category */
        .icon-prog   { color: #7eb8f7; }
        .icon-db     { color: #f7c77e; }
        .icon-math   { color: #a5d6a7; }
        .icon-tools  { color: #ce93d8; }
        .icon-concepts { color: var(--accent2); }
    </style>
</head>
<body>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="personal-info.html">About</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a href="work-experience.html">Experience</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<div class="page-wrap fade-in">
    <h1 class="section-title">Skills</h1>
    <div class="accent-line"></div>

    <div class="cards-grid" id="skillsGrid">
        <!-- Rendered by JS -->
    </div>
</div>

<footer>
    <p>&copy; 2025 Adebowale Peter Ajayi &nbsp;·&nbsp;
        <a href="https://linkedin.com/in/ajayipeter858" target="_blank">LinkedIn</a> &nbsp;·&nbsp;
        <a href="https://github.com/ajayipeter858" target="_blank">GitHub</a>
    </p>
</footer>

<script>
const ICONS = [
    'fa-code icon-prog',
    'fa-database icon-db',
    'fa-square-root-variable icon-math',
    'fa-screwdriver-wrench icon-tools',
    'fa-lightbulb icon-concepts'
];

document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('skillsGrid').innerHTML = CV_DATA.skills.map((s, i) => `
        <div class="skill-card">
            <p class="skill-category">
                <i class="fa-solid ${ICONS[i] || 'fa-star'}"></i>
                ${s.category}
            </p>
            <div class="tag-cloud">
                ${s.items.map(item => `<span class="stag">${item}</span>`).join('')}
            </div>
        </div>
    `).join('');
});
</script>
</body>
</html>
